<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="author" content="ThanhtaEdu">
<title>ThanhtaEdu | HTML → H5P Converter</title>
<style>
:root{
  --bg:#f6f7fb; --card:#fff; --text:#172033; --muted:#6b7280;
  --p1:#4f46e5; --p2:#7c3aed; --line:#e5e7eb; --ok:#059669; --err:#dc2626;

*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:
    radial-gradient(circle at 15% 10%,rgba(99,102,241,.10),transparent 30%),
    radial-gradient(circle at 85% 12%,rgba(168,85,247,.10),transparent 32%),
    var(--bg);
  color:var(--text)
}
.wrap{max-width:900px;margin:0 auto;padding:28px 18px 44px}
.top-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;padding:4px 2px;
}
.brand{
  display:flex;align-items:center;gap:12px;
  font-weight:900;font-size:24px;letter-spacing:-.02em;color:#158a78;
}
.brand-logo{
  width:42px;height:42px;border-radius:13px;display:grid;place-items:center;
  background:linear-gradient(135deg,#14b8a6,#0f8f7f);
  color:#fff;font-size:22px;box-shadow:0 8px 20px rgba(20,184,166,.22);
}
.brand-name .edu{color:#2563eb}
.header-mini{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  background:#fff;border:1px solid #e5e7eb;color:#94a3b8;
  box-shadow:0 6px 18px rgba(15,23,42,.05);font-size:16px;
}
.hero{
  background:linear-gradient(135deg,#252a67,#4f46e5 52%,#7c3aed);
  color:white;border-radius:28px;padding:28px;
  box-shadow:0 22px 55px rgba(79,70,229,.18)
}
.hero h1{margin:0;font-size:34px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.badge{
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);
  padding:7px 10px;border-radius:999px;font-size:12px;font-weight:700
}
.card{
  margin-top:18px;background:var(--card);border:1px solid var(--line);
  border-radius:22px;padding:22px;box-shadow:0 12px 35px rgba(15,23,42,.05)
}
.field{margin-top:14px}
.field:first-child{margin-top:0}
.field label{
  display:block;font-size:12px;font-weight:800;color:#475569;margin-bottom:7px
}
.field input{
  width:100%;border:1px solid var(--line);border-radius:12px;
  padding:12px 13px;font:inherit;outline:none
}
.field input:focus{
  border-color:#a5b4fc;box-shadow:0 0 0 3px rgba(99,102,241,.10)
}
.url-hint{margin-top:7px;font-size:11px;color:#8a94a6}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{
  border:0;border-radius:13px;padding:12px 16px;font-weight:900;cursor:pointer
}
.btn.primary{
  background:linear-gradient(135deg,var(--p1),var(--p2));color:white
}
.btn.secondary{background:#eef2ff;color:#3730a3}
.btn:disabled{opacity:.45;cursor:not-allowed}
.status{
  margin-top:16px;border-radius:14px;padding:13px 14px;background:#f8fafc;
  border:1px solid var(--line);font-size:13px;line-height:1.5
}
.status.ok{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}
.status.err{background:#fef2f2;border-color:#fecaca;color:#991b1b}
footer{text-align:center;color:#8a94a6;font-size:12px;margin-top:18px}
@media(max-width:700px){.hero h1{font-size:28px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top-header">
    <div class="brand">
      <div class="brand-logo">🎓</div>
      <div class="brand-name">Thanhta<span class="edu">Edu</span></div>
    </div>
    <div class="header-mini">◧</div>
  </header>

  <section class="hero">
    <h1>HTML → H5P Converter</h1>
    <div class="badges">
      <span class="badge">📦 Xuất .h5p</span>
      <span class="badge">🇻🇳 Giao diện tiếng Việt</span>
      <span class="badge">🌐 Nhúng URL</span>
    </div>
  </section>

  <section class="card">
    <div class="field">
      <label>Tiêu đề bài học</label>
      <input id="title" value="Bài học tương tác">
    </div>

    <div class="field">
      <label>Link bài HTML đã xuất bản</label>
      <input id="url" placeholder="https://...">
      <div class="url-hint">GitHub Pages, Netlify, Cloudflare Pages hoặc Vercel.</div>
    </div>

    <div class="actions">
      <button id="check" class="btn secondary">✓ Kiểm tra</button>
      <button id="build" class="btn primary" disabled>⬇ Tạo file H5P</button>
    </div>

    <div id="status" class="status">Sẵn sàng.</div>
  </section>

  <footer>ThanhtaEdu · maithanhta77@gmail.com</footer>
</div>

<script>
const $ = s => document.querySelector(s);

function setStatus(msg,type=''){
  const s=$('#status');
  s.className='status'+(type?' '+type:'');
  s.textContent=msg;
}
function validUrl(){return /^https:\/\/.+/i.test($('#url').value.trim())}
function updateBuild(){$('#build').disabled=!validUrl()}

$('#url').addEventListener('input',updateBuild);

$('#check').addEventListener('click',()=>{
  const ok=validUrl();
  setStatus(ok?'Link hợp lệ. Có thể tạo H5P.':'Vui lòng nhập link HTTPS hợp lệ.',ok?'ok':'err');
});

/* ZIP writer */
const crcTable=(()=>{
  let c,t=[];
  for(let n=0;n<256;n++){
    c=n;
    for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);
    t[n]=c>>>0;
  }
  return t;
})();
function crc32(bytes){
  let c=0xffffffff;
  for(let i=0;i<bytes.length;i++) c=crcTable[(c^bytes[i])&255]^(c>>>8);
  return(c^0xffffffff)>>>0;
}
const u16=n=>new Uint8Array([n&255,(n>>>8)&255]);
const u32=n=>new Uint8Array([n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255]);
function concat(parts){
  const len=parts.reduce((a,b)=>a+b.length,0),out=new Uint8Array(len);
  let p=0;
  for(const x of parts){out.set(x,p);p+=x.length}
  return out;
}
function dos(d=new Date()){
  return [
    ((d.getHours()&31)<<11)|((d.getMinutes()&63)<<5)|(Math.floor(d.getSeconds()/2)&31),
    (((d.getFullYear()-1980)&127)<<9)|(((d.getMonth()+1)&15)<<5)|(d.getDate()&31)
  ];
}
function makeZip(files){
  const enc=new TextEncoder(),locals=[],centrals=[];
  let offset=0;
  const [tm,dt]=dos();
  for(const f of files){
    const name=enc.encode(f.name),data=enc.encode(f.data),crc=crc32(data),flag=0x0800;
    const local=concat([
      u32(0x04034b50),u16(20),u16(flag),u16(0),u16(tm),u16(dt),
      u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),name,data
    ]);
    locals.push(local);
    const central=concat([
      u32(0x02014b50),u16(20),u16(20),u16(flag),u16(0),u16(tm),u16(dt),
      u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),
      u16(0),u16(0),u16(0),u32(0),u32(offset),name
    ]);
    centrals.push(central);
    offset+=local.length;
  }
  const localData=concat(locals),centralData=concat(centrals);
  const end=concat([
    u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),
    u32(centralData.length),u32(localData.length),u16(0)
  ]);
  return new Blob([localData,centralData,end],{type:'application/zip'});
}
function safeName(s){
  return (s||'bai_hoc').replace(/[\\/:*?"<>|]+/g,'_').replace(/\s+/g,'_').slice(0,90);
}

$('#build').addEventListener('click',()=>{
  if(!validUrl()){
    setStatus('Vui lòng nhập link HTTPS hợp lệ.','err');
    return;
  }

  const title=$('#title').value.trim()||'Bài học tương tác';
  const url=$('#url').value.trim();

  const h5p={
    title,
    language:'vi',
    mainLibrary:'H5P.IFrameEmbed',
    embedTypes:['div'],
    license:'U',
    authors:[{name:'ThanhtaEdu',role:'Author'}],
    preloadedDependencies:[
      {machineName:'H5P.IFrameEmbed',majorVersion:1,minorVersion:0}
    ]
  };

  const content={
    width:'900px',
    height:'900px',
    minWidth:'320px',
    source:url,
    resizeSupported:true
  };

  const blob=makeZip([
    {name:'h5p.json',data:JSON.stringify(h5p,null,2)},
    {name:'content/content.json',data:JSON.stringify(content,null,2)}
  ]);

  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=safeName(title)+'.h5p';
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1200);

  setStatus('Đã tạo file H5P.','ok');
});
</script>
</body>
</html>
